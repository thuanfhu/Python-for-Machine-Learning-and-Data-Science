<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Assignment</title>

    <style>
      body {
        font-family: sf pro text, -apple-system, BlinkMacSystemFont, Roboto,
          segoe ui, Helvetica, Arial, sans-serif, apple color emoji,
          segoe ui emoji, segoe ui symbol;
        font-weight: 400;
        line-height: 22.4px;
        font-size: 16px;
      }
      p, ul, ol {
        font-size: 16px;
        font-weight: 400;
      }
      h1, h2, h3, h4, h5, h6 {
        font-weight: bold;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        max-width: none;
      }
      .code-snippet {
        background-color: #fff;
        border: 1px solid #d1d7dc;
        color: #b4690e;
        font-size: 90%;
        padding: 0.2rem 0.4rem;
      }
      .code-block {
        background-color: #fff;
        color: #b4690e;
        font-size: 90%;
      }
      .black-block {
        color: #000000;
      }
      .italic-text {
        font-style: italic;
      }
    </style>
  </head>

  <body onload="main()">
    <h1 id="coding-title"></h1>
    <div>
      <h2>Instructions</h2>
      <div id="coding-instructions"></div>
    </div>
    <div>
      <h2>Test(s)</h2>
      <div id="coding-tests"></div>
    </div>
    <div>
      <h2>Solution(s)</h2>
      <div id="coding-solutions"></div>
    </div>

    <script>
      const quizData = {"title": "005 Coding Exercise Check-in Selecting Data from Numpy Array", "hasInstructions": true, "hasTests": true, "hasSolutions": true, "instructions": "<p><em>Let's check in with you to make sure you've understood the previous lecture. Make sure to read the instructions carefully!</em></p><p><strong>Coding Exercise Check-in: Selecting from Numpy Array</strong></p><p>TASK: A six sided die was rolled many times and the results of the rolls were saved to a numpy array called <strong>dice_rolls</strong>. How many times was a roll greater than 2 rolled? In other words, how many of the integers in the dice_rolls array are greater than 2? Assign your answer (should be an integer) to a variable called <strong>total_rolls_over_two</strong>. Please note, in order for the exercise to evaluate correctly, you <strong>must use the variable name total_rolls_over_two.</strong></p><p><em>Important Note: Make sure to read the above task very carefully! As the automated coding exercise evaluation system requires an exact match to be correct! The solution is in the next lecture.</em></p><p>Please try it on your own first! Still stuck? <strong>Link to Solution: https://gist.github.com/Pierian-Data/ea3121efac5dd3338c280ff10068f9c8</strong></p>", "tests": [{"file_name": "evaluate.py", "content": "from unittest import TestCase\nimport numpy as np\nfrom numpy.testing import assert_equal\n\nclass Evaluate(TestCase):\n    def test_array(self):\n        import exercise\n        \n        \n        if type(exercise.total_rolls_over_two) == type(np.array([1])):\n            msg = \"You returned a numpy array. Read the directions, you should return a single integer. \\n\\n\"\n        elif type(exercise.total_rolls_over_two) != type(19):\n            msg = \"Make sure your answer is an integer! \\n\\n\"\n        else:\n            msg = 'Uh oh! Looks like your code did not match our expected solution! \\n\\n Here is your result vs our expected output:\\n\\n'\n        assert_equal(exercise.total_rolls_over_two,19 ,err_msg=msg) \n"}], "solutions": [{"file_name": "exercise.py", "content": "import numpy as np\ndice_rolls = np.array([3, 1, 5, 2, 5, 1, 1, 5, 1, 4, 2, 1, 4, 5, 3, 4, 5, 2, 4, 2, 6, 6, 3, 6, 2, 3, 5, 6, 5])\n\ntotal_rolls_over_two = len(dice_rolls[dice_rolls>2])"}]};

      function renderCodeList(rootElement, codeList, className, titlePrefix) {
        for (var i = 0; i < codeList.length; i++) {
          var elem = codeList[i];
          var jsElem = document.createElement("div");
          jsElem.className = className;
          var jsElemTitle = document.createElement("h3");
          jsElemTitle.innerHTML = titlePrefix + " " + (i + 1);
          var jsElemBody = document.createElement("code");
          jsElemBody.className = "code-block black-block";
          jsElemBody.innerHTML = "<pre>" + elem.content + "</pre>";
          jsElem.appendChild(jsElemTitle);
          jsElem.appendChild(jsElemBody);
          rootElement.appendChild(jsElem);
        }
      }
      
      function main() {
        // display the assignment
        var codingTitle = document.getElementById("coding-title");
        codingTitle.innerHTML = quizData.title;
        
        var codingInstructions = document.getElementById("coding-instructions");
        if (quizData.hasInstructions) {
          codingInstructions.innerHTML = quizData.instructions;
        } else {
          codingInstructions.innerHTML = "<span class=\"italic-text\">" + quizData.instructions
            + "</span>";
        }

        // display the test(s)
        var codingTests = document.getElementById("coding-tests");
        if (!quizData.hasTests) {
          codingTests.innerHTML = "<span class=\"italic-text\">" + quizData.tests + "</span>";
        } else {
          renderCodeList(codingTests, quizData.tests, "coding-test", "Test");
        }
        

        // display the solution(s)
        var codingSolutions = document.getElementById("coding-solutions");
        if (!quizData.hasSolutions) {
          codingSolutions.innerHTML = "<span class=\"italic-text\">" + quizData.solutions + "</span>";
        } else {
          renderCodeList(codingSolutions, quizData.solutions, "coding-solution", "Solution");
        }
      }
    </script>
  </body>
</html>
